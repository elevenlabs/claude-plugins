[project]
name = "elevenlabs-stt"
version = "0.1.0"
description = "ElevenLabs Speech-to-Text input for Claude Code"
requires-python = ">=3.10"
license = "MIT"
keywords = ["claude", "speech-to-text", "stt", "voice", "elevenlabs"]

dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pynput>=1.7.6",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pyperclip>=1.8.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=9.0"]
windows = ["pywin32"]
dev = ["pytest", "ruff"]

[project.scripts]
elevenlabs-stt = "elevenlabs_stt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevenlabs_stt"]

[tool.ruff]
line-length = 100
target-version = "py310"
